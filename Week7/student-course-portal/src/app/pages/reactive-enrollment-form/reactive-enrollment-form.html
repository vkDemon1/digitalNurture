<h2>Reactive Enrollment Form</h2>
<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
  
  <div>
    <label>Name:</label>
    <input formControlName="studentName">
  </div>

  <div>
    <label>Email:</label>
    <input formControlName="studentEmail">
    <span style="color:red" *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">Email taken!</span>
  </div>

  <div>
    <label>Course ID (Don't start with XX):</label>
    <input formControlName="courseId">
    <span style="color:red" *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">Course code starting with XX is not allowed.</span>
  </div>

  <div>
    <label>Semester:</label>
    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label><input type="checkbox" formControlName="agreeToTerms"> I agree</label>
  </div>

  <div formArrayName="additionalCourses">
    <h4>Additional Courses</h4>
    <button type="button" (click)="addCourse()">Add Another Course</button>
    <div *ngFor="let ctrl of additionalCourses.controls; let i=index">
      <input [formControlName]="i">
      <button type="button" (click)="removeCourse(i)">Remove</button>
    </div>
  </div>

  <button type="submit" [disabled]="enrollForm.invalid" style="margin-top: 15px;">Submit</button>
</form>
