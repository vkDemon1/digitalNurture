<h2>Student Enrollment Request</h2>

<form #enrollForm="ngForm" (ngSubmit)="onSubmit(enrollForm)" style="display: flex; flex-direction: column; gap: 15px; max-width: 400px;">

  <div>
    <label>Student Name:</label><br>
    <input type="text" name="studentName" [(ngModel)]="studentName" required minlength="3" #nameCtrl="ngModel">
    
    <span class="error-text" *ngIf="nameCtrl.touched && nameCtrl.errors?.['required']">Name is required.</span>
    <span class="error-text" *ngIf="nameCtrl.touched && nameCtrl.errors?.['minlength']">Name must be at least 3 characters.</span>
  </div>

  <div>
    <label>Email:</label><br>
    <input type="email" name="studentEmail" [(ngModel)]="studentEmail" required email #emailCtrl="ngModel">
    <span class="error-text" *ngIf="emailCtrl.touched && emailCtrl.errors?.['required']">Email is required.</span>
    <span class="error-text" *ngIf="emailCtrl.touched && emailCtrl.errors?.['email']">Must be a valid email format.</span>
  </div>

  <div>
    <label>Course ID:</label><br>
    <input type="number" name="courseId" [(ngModel)]="courseId" required>
  </div>

  <div>
    <label>Preferred Semester:</label><br>
    <select name="preferredSemester" [(ngModel)]="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>
  </div>

  <div>
    <label>
      <input type="checkbox" name="agreeToTerms" [(ngModel)]="agreeToTerms" required>
      I agree to the terms and conditions
    </label>
  </div>

  <div style="display: flex; gap: 10px;">
    <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    <button type="button" (click)="enrollForm.resetForm(); submitted = false">Reset</button>
  </div>

  <div class="success-box" *ngIf="submitted">
    Enrollment request submitted successfully!
  </div>

</form>
